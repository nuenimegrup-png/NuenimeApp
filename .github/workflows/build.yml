name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must match the version in app.config.ts)"
        required: false
        default: "v0.0.1"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (typecheck, lint, tests)
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
      EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.anilist.co"
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm lint
        continue-on-error: true

      - run: pnpm test

  build:
    name: Build ${{ matrix.label }} APK (${{ github.event.inputs.tag || github.ref_name }})
    runs-on: ubuntu-latest
    # Gate the release pipeline on validation: without this, flipping
    # continue-on-error on the validate job would not block anything.
    needs: validate
    strategy:
      matrix:
        include:
          - arch: arm64-v8a
            label: arm64
          - arch: armeabi-v7a
            label: arm32
          - arch: armeabi-v7a,arm64-v8a,x86_64
            label: universal
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' app.config.ts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "App version: $APP_VERSION | Release tag: $RELEASE_TAG"
          test "v$APP_VERSION" = "$RELEASE_TAG" || { echo "ERROR: tag $RELEASE_TAG does not match app version $APP_VERSION in app.config.ts"; exit 1; }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.anilist.co"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '444728416290-ohgsfpd6bon745bdh5kshvth16rn8eh6.apps.googleusercontent.com' }}

      - name: Build APK (${{ matrix.label }})
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=${{ matrix.arch }} \
            -PnewArchEnabled=false \
            --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_GRAPHQL_URL: "https://graphql.aniraku.tech"
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_MAL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_MAL_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '444728416290-ohgsfpd6bon745bdh5kshvth16rn8eh6.apps.googleusercontent.com' }}

      - name: Rename and Print APK Fingerprint
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "Built: aniraku-${RELEASE_TAG}-${{ matrix.label }}.apk"
          echo "================ APK CERTIFICATE FINGERPRINTS ================"
          keytool -printcert -jarfile "$APK" | grep -iE "SHA1|SHA256" || keytool -printcert -jarfile "$APK"
          echo "=============================================================="

      - uses: actions/upload-artifact@v4
        with:
          name: aniraku-${{ matrix.label }}
          path: aniraku-${{ env.RELEASE_TAG }}-${{ matrix.label }}.apk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List APKs
        run: ls -lh ./artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nuenime ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          body: |
            ## Nuenime ${{ env.RELEASE_TAG }}

            - **Fitur Gacha & Koleksi Banner Profil**: Dukungan GIF animasi, PNG, JPG, biaya kustom Dylan Crystal, setting drop rate dinamis di Admin Dashboard.
            - **Hadiah Massal (Mailbox)**: Pengiriman hadiah massal admin ke seluruh pemain, notifikasi lonceng & popup klaim interaktif.
            - **Stabilitas API**: Automatic failover ke official AniList GraphQL.
            - **Perbaikan UI & Legalitas**: Dukungan support & donasi Saweria, Nothing UI styling.

            Download file APK di bawah ini dan pasang di perangkat Android Anda.
          files: ./artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
